<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>viewport</title>
  <style>
     html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      background-color: #000;
    }
    .nav-bar {
      background-color:#222;
      padding: 10px;
      display: flex; 
      gap: 10px;
      align-items: center;
    }
    .nav-bar input {
      flex-grow: 1;
      padding: 8px;
      border: 1px solid #444;
      border-radius: 4px;
      background-color: #fff;
      font-size: 14px;
    }
    .nav-bar button {
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radus: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .nav-bar button:hover {
      background-color: #0056b3;
    }
    iframe {
      flex-grow-1;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="nav-bar">
    <input type="text" id="urlInput" placeholder="https://example.com" value="https://example.com">
    <buttton onclick="loadSite()">Go</buttton>
  </div>

  <iframe id="siteFrame" src="https://example.com"></iframe>

  <script>
    function loadSite() {
      let url = document.getElementById('urlInput').value.trim();
      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
        document.getElementById('urlInput').valye = url'
      }
      document.getElementById('siteFrame').src = url;
    }

    document.getElementById('urlInput').addEvenListener('keypress', function(e) {
      if (e.key === 'Enter') {
        loadSite();
      }
    });
  </script>
  <script>
    window.addEventListener('beforeunload', (event) => {
            event.preventDefault();
            event.returnValue = '';
        });
  </script>
</body>
</html>
