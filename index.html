<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>viewport</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
            background-color: #111;
        }
        .top-bar {
            height: 55px;
            background-color: #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            gap: 12px;
            box-sizing: border-box;
            border-bottom: 1px solid #333;
        }
        .top-bar input {
            flex-grow: 1;
            min-width: 100px;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #fff;
            color: #000;
            box-sizing: border-box;
        }
        .top-bar button {
            width: 70px;
            height: 34px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            flex-shrink: 0; 
        }

        .top-bar button:hover {
            background-color: #0056b3;
        }

        iframe {
            width: 100%;
            height: calc(100% - 55px);
            border: none;
            display: block;
            background-color: #fff;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <input type="text" id="urlInput" placeholder="Type a website address here..." value="https://example.com">
        <button onclick="loadNewSite()">Go</button>
    </div>

    <iframe id="displayFrame" src="https://example.com"></iframe>

    <script>
        function loadNewSite() {
            let url = document.getElementById('urlInput').value.trim();
            if (!url) return;
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
                document.getElementById('urlInput').value = url;
            }
            
            document.getElementById('displayFrame').src = url;
        }
        document.getElementById('urlInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loadNewSite();
            }
        });
    </script>
    <script>
        window.addEventListener('beforeunload', (event) => {
            event.preventDefault();
            event.returnValue = '';
        });
    </script>
</body>
</html>
